# Builds the apps on GitHub's Macs, so no Mac of your own is needed.
#
# It builds three apps:
#   RugbyCam-Lite   the iPhone app without live streaming (no outside library)
#   RugbyCam        the full iPhone app, with the HaishinKit streaming library
#   RugbyCamRemote  the iPad remote control app ("RC Remote")
# If Lite builds and RugbyCam does not, the problem is in the streaming part.
#
# The results are unsigned .ipa files under "Artifacts" on the run's page.
# Install them with AltStore or Sideloadly (see README.md).

name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.project }}
    # GitHub's Apple-chip Macs (macos-26) were often fully booked, so this uses
    # an Intel Mac. If this label stops working, try macos-26 or macos-latest.
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: RugbyCam-Lite
            app: RugbyCam
          - project: RugbyCam
            app: RugbyCam
          - project: RugbyCamRemote
            app: RugbyCamRemote

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use the newest Xcode on the machine
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version

      - name: Check the project files
        run: python3 tools/check_project.py

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ matrix.project }}.xcodeproj" \
            -scheme "${{ matrix.project }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show only the errors
        if: failure()
        run: |
          echo "----- errors -----"
          grep -n -E "error:|BUILD FAILED" build.log | head -150 || true

      - name: Package the app as an .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${{ matrix.app }}.app" Payload/
          zip -qry "${{ matrix.project }}.ipa" Payload

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-ipa
          path: ${{ matrix.project }}.ipa

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-build-log
          path: build.log
